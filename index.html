<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Colorful Book Library</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #29234a;
        }

        header {
            background: linear-gradient(135deg, #7041e8, #ed4c9b);
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        header p {
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
        }

        input, select {
            flex: 1;
            min-width: 180px;
            border: 1px solid #d7cef3;
            background: white;
        }

        button {
            border: none;
            background: #7041e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5125c9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 22px;
            color: #7041e8;
            font-weight: bold;
        }

        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 4px solid #ddd3ff;
            border-top-color: #7041e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #message {
            margin: 18px 0;
            text-align: center;
            color: #625b7b;
        }

        #bookList {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
            border: 1px solid #e7e0fa;
            border-radius: 14px;
            box-shadow: 0 5px 16px #34216b12;
            transition: 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 24px #34216b20;
        }

        .cover {
            height: 220px;
            background: #eee8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .cover img {
            height: 195px;
            max-width: 100%;
            object-fit: contain;
        }

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .category-tag {
            align-self: flex-start;
            padding: 5px 9px;
            background: #f0eaff;
            color: #7041e8;
            font-size: 11px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .book-info h3 {
            margin: 0 0 10px;
            font-size: 17px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .author {
            font-size: 13px;
            color: #77718c;
            line-height: 1.5;
            margin: 0 0 16px;
        }

        .read-more {
            margin-top: auto;
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #7041e8;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .read-more:hover {
            background: #5125c9;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            background: #29234a;
            color: white;
            padding: 22px;
            margin-top: 40px;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            #bookList {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            #bookList {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            header h1 {
                font-size: 28px;
            }

            .cover {
                height: 180px;
            }

            .cover img {
                height: 160px;
            }

            .book-info {
                padding: 12px;
            }
        }

        @media (max-width: 380px) {
            #bookList {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 My Colorful Library</h1>
        <p>Discover your next favourite book!</p>
    </header>

    <main class="container">

        <h2>Explore Books ✨</h2>

        <div class="toolbar">

            <button id="loadBooks">📖 Load Books</button>

            <input
                type="search"
                id="searchBox"
                placeholder="Search by title or author..."
                aria-label="Search books"
            >

            <select id="category" aria-label="Book category">
                <option value="fiction">Fiction</option>
                <option value="fantasy">Fantasy</option>
                <option value="science_fiction">Science Fiction</option>
                <option value="mystery">Mystery</option>
                <option value="romance">Romance</option>
                <option value="history">History</option>
            </select>

        </div>

        <div id="loading" role="status">
            <span class="spinner"></span>
            Loading books...
        </div>

        <p id="message" aria-live="polite">
            Click "Load Books" to get started!
        </p>

        <section id="bookList" aria-label="Book results"></section>

    </main>

    <footer>
        Powered by Open Library API | Built with jQuery AJAX
    </footer>

    <script>
        // Store books received from the API
        var allBooks = [];

        // Button click event
        $("#loadBooks").click(function() {
            loadBooks();
        });

        // Category filter event
        $("#category").change(function() {
            loadBooks();
        });

        // Search event
        $("#searchBox").on("input", function() {
            displayBooks();
        });

        // Fetch books from the API
        function loadBooks() {
            var category = $("#category").val();

            $("#loading").show();
            $("#message").text("");
            $("#bookList").empty();
            $("#loadBooks").prop("disabled", true);

            $.ajax({
                url: "https://openlibrary.org/subjects/"
                     + encodeURIComponent(category) + ".json",

                type: "GET",
                dataType: "json",
                data: {
                    limit: 20
                },

                // Successful API response
                success: function(data) {
                    allBooks = data.works || [];
                    displayBooks();
                },

                // Failed API request
                error: function() {
                    allBooks = [];
                    $("#message").text(
                        "Unable to load books. Check your internet connection and try again."
                    );
                    $("#bookList").html(
                        '<div class="empty">Books could not be loaded.</div>'
                    );
                },

                // Runs after success or error
                complete: function() {
                    $("#loading").hide();
                    $("#loadBooks").prop("disabled", false);
                }
            });
        }

        // Search and display books
        function displayBooks() {
            var searchText = $("#searchBox").val()
                .trim()
                .toLowerCase();

            var filteredBooks = allBooks.filter(function(book) {
                var title = (book.title || "").toLowerCase();

                var authors = (book.authors || [])
                    .map(function(author) {
                        return author.name || "";
                    })
                    .join(" ")
                    .toLowerCase();

                return title.includes(searchText) ||
                       authors.includes(searchText);
            });

            $("#bookList").empty();

            // Display the number of matching books
            $("#message").text(
                "Showing " + filteredBooks.length +
                " of " + allBooks.length + " books"
            );

            if (filteredBooks.length === 0) {
                $("#bookList").html(
                    '<div class="empty">No matching books found.</div>'
                );
                return;
            }

            // Display each book
            $.each(filteredBooks, function(index, book) {

                var title = book.title || "Untitled Book";

                var author = book.authors &&
                             book.authors.length > 0
                    ? book.authors.map(function(a) {
                        return a.name;
                    }).filter(Boolean).join(", ")
                    : "Unknown Author";

                var coverURL = book.cover_id
                    ? "https://covers.openlibrary.org/b/id/"
                      + book.cover_id + "-M.jpg"
                    : "https://placehold.co/160x220/eee8ff/7041e8?text=No+Cover";

                var bookURL = book.key
                    ? "https://openlibrary.org" + book.key
                    : "https://openlibrary.org";

                // Create book card elements
                var card = $("<article>").addClass("book-card");
                var cover = $("<div>").addClass("cover");

                var image = $("<img>")
                    .attr("src", coverURL)
                    .attr("alt", "Cover of " + title)
                    .attr("loading", "lazy");

                // Fallback for unavailable images
                image.on("error", function() {
                    $(this)
                        .off("error")
                        .attr(
                            "src",
                            "https://placehold.co/160x220/eee8ff/7041e8?text=No+Cover"
                        );
                });

                cover.append(image);

                var info = $("<div>").addClass("book-info");

                $("<span>")
                    .addClass("category-tag")
                    .text($("#category option:selected").text())
                    .appendTo(info);

                $("<h3>")
                    .text(title)
                    .appendTo(info);

                $("<p>")
                    .addClass("author")
                    .text("✍️ " + author)
                    .appendTo(info);

                $("<a>")
                    .addClass("read-more")
                    .attr("href", bookURL)
                    .attr("target", "_blank")
                    .attr("rel", "noopener noreferrer")
                    .text("Read More ↗")
                    .appendTo(info);

                card.append(cover, info);
                $("#bookList").append(card);
            });
        }
    </script>

</body>
</html>
